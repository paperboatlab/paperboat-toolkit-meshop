# Build the toolkit against the engine and run its smoke test.
# The engine is public, so the checkout needs no token and this job always builds it: a skipped
# build shows green without testing anything.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat
          path: paperboat

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPAPERBOAT_SOURCE_DIR="$GITHUB_WORKSPACE/paperboat" \
            -DPAPERBOAT_WITH_SUNDIALS=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure

  # The path a user takes (paperboatlab/paperboat#354): paperboat installed as a release (shared engine and
  # SDK), then `paperboat toolkit install` builds this toolkit as a plugin against it. No engine checkout.
  plugin:
    name: Install as a plugin on an installed paperboat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: paperboatlab/paperboat
          ref: dev
          path: paperboat
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake g++ git 
      - name: paperboat, installed as a release would be
        run: |
          cmake -S paperboat/engine -B "$RUNNER_TEMP/pb-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DPAPERBOAT_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/pb-build"
          cmake --install "$RUNNER_TEMP/pb-build" --prefix "$RUNNER_TEMP/pb"
      - name: paperboat toolkit install meshop, from this checkout
        env:
          PAPERBOAT_HOME: ${{ runner.temp }}/home
        run: |
          cd "$RUNNER_TEMP"   # outside any checkout: the installed paperboat, as a user has it
          "$RUNNER_TEMP/pb/bin/paperboat" toolkit install meshop --path "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/pb/bin/paperboat" toolkit list meshop | grep -q "meshop/"
